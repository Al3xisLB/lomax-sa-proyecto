services:
  db:
    image: postgres:16-alpine
    container_name: lomax-db-docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lomax_db
    ports:
      - "5434:5432"

  backend:
    build: .
    container_name: lomax-backend-docker
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=lomax_db
      - DB_PORT=5432
      - PORT=3000
    depends_on:
      - db